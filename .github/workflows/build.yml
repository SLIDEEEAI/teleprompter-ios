name: Build iPhone prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for physical iPhone
        run: |
          xcodebuild -project Teleprompter.xcodeproj -scheme Teleprompter -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned app for local signing
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Teleprompter.app package/Payload/
          cd package
          zip -qr ../Teleprompter-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Teleprompter-unsigned
          path: Teleprompter-unsigned.ipa
          retention-days: 7
